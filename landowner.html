<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Landowner Intake Form</title>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body> 
  <!-- Navigation bar-->
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="index.html">Landowner Page</a>
  </nav>
  
  <h1>Landowner Form</h1>
  <!--   Form for adding lndowners-->
  <form id="landowner-form">
    <input id="nid_number" placeholder="NID Number" required/>
    <input id="birth_certificate_reg" placeholder="Birth Certificate"/>
    <input id="given_names" placeholder="Given Names"/>
    <input id="family_name" placeholder="Family Name"/>
    <input id="date_of_birth" placeholder="Date of Birth"/>
    <input id="place_of_birth" placeholder="Place of Birth"/>
    <input id="gender" placeholder="Gender"/>
    <input id="province" placeholder="Province"/>
    <input id="district"placeholder="District"/>
    <input id="llg"placeholder="Llg"/>
    <input id="ward"placeholder="Ward"/>
    <input id="village_town"placeholder"village/Town"/>
    <input id="clan"placeholder"Clan"/>
    <input id="tribe"placeholder="Tribe"/>
    <input id="mobile_number"placeholder="Mobile Number"/>
    <input id="education_level"placeholder="Education Level"/>
    <input id="occupation"placeholder="Occupation"/>
    <input id="denomination"placeholder="Denomination"/>
    <input id="marital_status"placeholder="Marital Status"/>
    <input id="gps-boundary"placeholder="gps Boundary"/>
    
    <button type="submit">Submit</button>
  </form>
   <!-- Table to display results -->
  <h2>Landowners</h2>
  <table id="landowners-table">
    <thead>
      <tr>
        <th>NID</th>
        <th>Given Names</th>
        <th>Family Name</th>
        <th>Date of Birth</th>
        <th>Place of Birth</th>
        <th>gender</th>
        <th>Province</th>
        <th>District</th>
        <th>LLG</th>
        <th>Llg</th>
        <th>Ward</th>
        <th>Village/Town</th>
        <th>Clan</th>
        <th>Tribe</th>
        <th>Mobile Number</th>
        <th>Education Level</th>
        <th>Occupation</th>
        <th>Denomination</th>
        <th>Marital Status</th>
        <th>gps Boundary</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Selection to display results-->
  <div id="output"> Loading...</div>
  <script type="module">
     import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    // Replace with your Supabase project details
    const supabaseUrl = 'https://dbppvcfxtbhuuskwyycc.supabase.co';
    const supabaseKey = sb_publishable_vWNRqdWRDV8el4eWD0rIFg_nB1PxaUI;
    const supabase = createClient(supabaseUrl, supabaseKey);
    //Test connections
    async function testConnection() {
  const { data, error } = await supabase
    .from("landowners")
    .select("*");

  if (error) {
    console.error("❌ Supabase error:", error.message);
  } else {
    console.log("✅ Supabase connected. Rows:", data);
  }
}

// Run the test when page loads
testConnection();

    const form = document.getElementById("landowner-form");
    const output = document.getElementById("output");
    const tableBody = document.querySelector("#landowners-table tbody");
    
    //Insert new landowner
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nid_number = document.getElementById("nid_number").value;
      const birth_certificate_reg = document.getElementById("birth_certificate_reg").value;
      const given_names=document.getElementById("given_names").value;
      const family_name=document.getElementById("family_name").value;
      const date_of_birth=document.getElementById("date_of_birth").value;
      const place_of_birth=document.getElementById("place_of_birth").value;
      const gender=document.getElementById("gender").value;
      const province=document.getElementById("province").value;
      const district=document.getElementById("district").value;
      const llg=document.getElementById("llg").value;
      const ward=document.getElementById("ward").value;
      const village_town=document.getElementById("village_town").value;
      const clan=document.getElementById("clan").value;
      const tribe=document.getElementById("tribe").value;
      const mobile_number=document.getElementById("mobile_number").value;
      const education_level=document.getElementById("education_level").value;
      const occupation=document.getElementById("occupation").value;
      const denomination=document.getElementById("denomination").value;
      const marital_status=document.getElementById("marital_status").value;
      const gps_boundary=document.getElementById("gps_boundary").value;

      const { error } = await supabase
        .from("landowners")
        .insert([{
           nid_number,
          birth_certificate_reg,
          given_names,
          family_name,
          date_of_birth,
          place_of_birth,
          gender,
          province,
          district,
          llg,
          ward,
          village_town,
          clan,
          tribe,
          mobile_number,
          education_level,
          occupation,
          denomination,
          marital_status,
          gps_boundary
          
        }]);

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Landowner added successfully!");
        form.reset();
        loadLandowners(); //refresh list after insert
      }
    });
    //Fetch and display landowners
    async function loadLandowners(){
      const {data, error} = await supabase
      .form("landowners")
      .select("*");

      if (error){
        tableBody.innerHTML = `<tr><td colspan="6">Error: ${error.message}</td></tr>`;
      } else{
        tableBody.innerHTML = data.map(l => `
          <tr>
            <td>${l.nid_number || ""}</td>
            <td>${l.given_names || ""}</td>
            <td>${l.family_name || ""}</td>
            <td>${l.date_of_birth || ""}</td>
            <td>${l.place_of_birth || ""}</td>
            <td>${l.gender || ""}</td>
            <td>${l.province || ""}</td>
            <td>${l.district || ""}</td>
            <td>${l.llg || ""}</td>
            <td>${l.ward || ""}</td>
            <td>${l.village_town || ""}</td>
            <td>${l.clan || ""}</td>
            <td>${l.tribe || ""}</td>
            <td>${l.mobile_number || ""}</td>
            <td>${l.education_level || ""}</td>
            <td>${l.occupation || ""}</td>
            <td>${l.denomination || ""}</td>
            <td>${l.marital_status || ""}</td>
            <td>${l.gps_boundary || ""}</td>
          </tr>
        `).join("");
      }
    }
    //Load existing records on page start
    loadLandowners();
  </script>
</body>
</html>
