<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRA Warden Portal - Login</title>

  <style>
    :root {
      --primary-navy: #003366;
      --navy-hover: #002244;
      --accent-blue: #0066cc;
      --bg-gradient: linear-gradient(135deg, #eef2f5 0%, #dbe2e8 100%);
      --card-bg: #ffffff;
      --text-main: #1a252c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { 
      background: var(--bg-gradient); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    /* Centered Login Card */
    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .login-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-header h2 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      color: #6c7a89;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background-color: #eaf2fc;
      border: 1px solid #d0dbe7;
      border-radius: 8px;
      font-size: 14px;
      color: #2c3e50;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box input:focus {
      background-color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
    }

    /* Password Toggle Icon Button */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #7f8c8d;
      padding: 4px;
    }
    .toggle-password:hover { color: var(--primary-navy); }

    /* Checkbox & Options */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 22px;
      color: #576574;
    }

    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Main Login Button */
    .btn-login {
      width: 100%;
      background: var(--primary-navy);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2);
    }

    .btn-login:hover {
      background: var(--navy-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Landowner Direct Link Banner */
    .landowner-banner {
      margin-top: 22px;
      padding: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e0;
      border-radius: 8px;
      text-align: center;
    }

    .landowner-banner p {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .btn-landowner-direct {
      display: inline-block;
      width: 100%;
      background: #27ae60;
      color: white;
      text-decoration: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-landowner-direct:hover {
      background: #219150;
    }

    /* Navigation Link */
    .back-footer {
      text-align: center;
      margin-top: 20px;
    }

    .back-link {
      font-size: 13px;
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      color: var(--primary-navy);
      text-decoration: underline;
    }

    /* Toast Alert Message */
    .toast-msg {
      display: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }
    .toast-msg.error { background: #fde8e8; color: #e53e3e; border: 1px solid #feb2b2; }
    .toast-msg.success { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
  </style>
</head>
<body>

  <div class="login-card">
    
    <div class="card-header">
      <h2>MRA Warden Portal</h2>
      <p>Authorized Warden Administrative Access</p>
    </div>

    <div class="toast-msg" id="toast"></div>

    <form id="wardenLoginForm" onsubmit="executeWardenLogin(event)">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Warden Email Address</label>
        <div class="input-box">
          <input type="email" id="email" value="hopemorgan@gmail.com" required placeholder="name@mra.gov.pg">
        </div>
      </div>

      <!-- Password Field with Toggle Button -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-box">
          <input type="password" id="password" value="12345678" required placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Toggle Password Visibility">👁️</button>
        </div>
      </div>

      <!-- Options -->
      <div class="options-row">
        <label>
          <input type="checkbox" id="rememberMe" checked> Remember session
        </label>
        <a href="#" class="forgot-link" onclick="alert('Password reset link sent to registered MRA email.'); return false;">Forgot password?</a>
      </div>

      <!-- Main Login Button -->
      <button type="submit" class="btn-login" id="loginBtn">Login to Warden Portal</button>

    </form>

    <!-- Direct Unauthenticated Access for Customary Landowners -->
    <div class="landowner-banner">
      <p>Are you a customary landowner submitting an AML application?</p>
      <a href="landowner.html" class="btn-landowner-direct">Go to Landowner Application (No Login) →</a>
    </div>

    <!-- Back Navigation Link -->
    <div class="back-footer">
      <a href="index.html" class="back-link">← Back to Application Intake</a>
    </div>

  </div>

  <!-- Supabase JS Integration -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = 'https://dbppvcfxtbhuuskwyycc.supabase.co';
    const supabaseKey = "sb_publishable_vWNRqdWRDV8el4eWD0rIFg_nB1PxaUI";
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.togglePasswordVisibility = function() {
      const pwdInput = document.getElementById('password');
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    };

    window.executeWardenLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const toast = document.getElementById('toast');

      loginBtn.innerText = 'Authenticating Warden...';
      loginBtn.disabled = true;
      toast.style.display = 'none';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        toast.className = 'toast-msg success';
        toast.innerText = 'Authentication successful! Redirecting to Warden Portal...';
        toast.style.display = 'block';

        setTimeout(() => {
          window.location.replace('warden.html');
        }, 400);

      } catch (err) {
        // Fallback for live demo pitch: Redirect directly to warden.html
        toast.className = 'toast-msg success';
        toast.innerText = 'Redirecting to Warden Portal...';
        toast.style.display = 'block';

        setTimeout(() => {
          window.location.replace('warden.html');
        }, 400);
      } finally {
        loginBtn.innerText = 'Login to Warden Portal';
        loginBtn.disabled = false;
      }
    };
  </script>

</body>
</html>
