<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRA Warden Portal - Login</title>

  <style>
    :root {
      --primary-navy: #003366;
      --navy-hover: #002244;
      --accent-blue: #0066cc;
      --bg-gradient: linear-gradient(135deg, #eef2f5 0%, #dbe2e8 100%);
      --card-bg: #ffffff;
      --text-main: #1a252c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { 
      background: var(--bg-gradient); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    /* Centered Login Card */
    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .login-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-header h2 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
      color: #6c7a89;
    }

    /* Interactive Role Selector Pills */
    .role-pills {
      display: flex;
      background: #f1f4f8;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 22px;
    }

    .role-btn {
      flex: 1;
      border: none;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: #6c7a89;
      transition: all 0.2s ease;
    }

    .role-btn.active {
      background: #ffffff;
      color: var(--primary-navy);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      background-color: #eaf2fc;
      border: 1px solid #d0dbe7;
      border-radius: 8px;
      font-size: 14px;
      color: #2c3e50;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-box input:focus {
      background-color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
    }

    /* Password Toggle Icon Button */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #7f8c8d;
      padding: 4px;
    }
    .toggle-password:hover { color: var(--primary-navy); }

    /* Checkbox & Options */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 22px;
      color: #576574;
    }

    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Main Login Button */
    .btn-login {
      width: 100%;
      background: var(--primary-navy);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2);
    }

    .btn-login:hover {
      background: var(--navy-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Demo Quick-Fill Buttons */
    .demo-section {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed #e0e6ed;
      text-align: center;
    }

    .demo-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #95a5a6;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .demo-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-demo {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #dce4ec;
      padding: 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-demo:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
      color: var(--primary-navy);
    }

    /* Navigation Link */
    .back-footer {
      text-align: center;
      margin-top: 22px;
    }

    .back-link {
      font-size: 13px;
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--primary-navy);
      text-decoration: underline;
    }

    /* Toast Alert Message */
    .toast-msg {
      display: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }
    .toast-msg.error { background: #fde8e8; color: #e53e3e; border: 1px solid #feb2b2; }
    .toast-msg.success { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
  </style>
</head>
<body>

  <div class="login-card">
    
    <div class="card-header">
      <h2>MRA Warden Portal</h2>
      <p>Customary Landowner & Warden Administration</p>
    </div>

    <!-- Role Selection Tabs -->
    <div class="role-pills">
      <button type="button" class="role-btn active" id="roleWarden" onclick="selectRole('warden')">MRA Warden</button>
      <button type="button" class="role-btn" id="roleLandowner" onclick="selectRole('landowner')">Landowner</button>
    </div>

    <div class="toast-msg" id="toast"></div>

    <form id="loginForm" onsubmit="executeLogin(event)">
      
      <!-- Email Field (Pre-filled with hopemorgan@gmail.com) -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-box">
          <input type="email" id="email" value="hopemorgan@gmail.com" required placeholder="name@mra.gov.pg">
        </div>
      </div>

      <!-- Password Field with Toggle Button -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-box">
          <input type="password" id="password" value="12345678" required placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Toggle Password Visibility">👁️</button>
        </div>
      </div>

      <!-- Checkbox Options -->
      <div class="options-row">
        <label>
          <input type="checkbox" id="rememberMe" checked> Remember session
        </label>
        <a href="#" class="forgot-link" onclick="alert('Password reset link sent to registered MRA email.'); return false;">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-login" id="loginBtn">Login to Portal</button>

    </form>

    <!-- Quick Demo Auto-Fill Buttons -->
    <div class="demo-section">
      <div class="demo-title">⚡ Quick Demo Auto-Fill</div>
      <div class="demo-buttons">
        <button type="button" class="btn-demo" onclick="fillCredentials('hopemorgan@gmail.com', 'warden')">MRA Warden</button>
        <button type="button" class="btn-demo" onclick="fillCredentials('john.kila@watut.pg', 'landowner')">Landowner</button>
      </div>
    </div>

    <!-- Back Navigation Link -->
    <div class="back-footer">
      <a href="index.html" class="back-link">← Back to Application Intake</a>
    </div>

  </div>

  <!-- Supabase JS Integration -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = 'https://dbppvcfxtbhuuskwyycc.supabase.co';
    const supabaseKey = "sb_publishable_vWNRqdWRDV8el4eWD0rIFg_nB1PxaUI";
    const supabase = createClient(supabaseUrl, supabaseKey);

    let activeRole = 'warden';

    window.selectRole = function(role) {
      activeRole = role;
      document.getElementById('roleWarden').classList.toggle('active', role === 'warden');
      document.getElementById('roleLandowner').classList.toggle('active', role === 'landowner');
    };

    window.togglePasswordVisibility = function() {
      const pwdInput = document.getElementById('password');
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    };

    window.fillCredentials = function(email, role) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = '12345678';
      window.selectRole(role);
    };

    window.executeLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const toast = document.getElementById('toast');

      loginBtn.innerText = 'Authenticating...';
      loginBtn.disabled = true;
      toast.style.display = 'none';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        toast.className = 'toast-msg success';
        toast.innerText = 'Login successful! Redirecting...';
        toast.style.display = 'block';

        setTimeout(() => {
          if (activeRole === 'warden') {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'landowner.html';
          }
        }, 600);

      } catch (err) {
        toast.className = 'toast-msg error';
        toast.innerText = err.message || 'Invalid login credentials.';
        toast.style.display = 'block';
      } finally {
        loginBtn.innerText = 'Login to Portal';
        loginBtn.disabled = false;
      }
    };
  </script>

</body>
</html>
