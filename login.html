<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MRA Warden Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #004080; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #003366; }
    .error { color: red; font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>MRA Warden Portal</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Warden Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <div id="error-message" class="error"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = 'https://dbppvcfxtbhuuskwyycc.supabase.co';
    const supabaseKey = "sb_publishable_vWNRqdWRDV8el4eWD0rIFg_nB1PxaUI";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const loginForm = document.getElementById("login-form");
    const errorMessage = document.getElementById("error-message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorMessage.textContent = error.message;
      } else {
        // Successful login, redirect to the secure dashboard
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
